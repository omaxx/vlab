# SP lab from topology/topology.drawio (diagram "sp"): 10 Juniper vMX
# P: R1-R4, PE: R5-R8, CE: R10, R20; id = router number, link ip .<id>, loopbacks from the drawing
# links are p2p: networks R<a>_R<b>, subnet 10.0.<a><b>.0/24 (R10/R20 count as 9)
# all devices also on mgmt-1 (networks/mgmt.yaml), mgmt ip 172.255.1.<id> (static, no dhcp)
# config template configs/vmx.conf.j2

templates:                # common parts, deep-merged under each device's own spec
  vmx:
    type: jnpr/vmx
    version: 24.4R1-S2.9
    re_image: junos-vmx-x86-64-24.4R1-S2.9.qcow2
    fpc_image: vFPC-20241118.img
    mgmt:
      network: mgmt-1

devices:
  R1:
    template: vmx
    id: 1
    mgmt:
      ip: 172.255.1.1/24
    ports:
      - p2p: R1_R3
      - p2p: R1_R4
      - p2p: R1_R5
      - p2p: R1_R6
      - p2p: R1_R2
    config: vmx.conf.j2
    vars:
      root_password: "$6$vlabvlab$5dQUFdNoOCf9So8AVoZ6h0YNmeTTcxbnITrhfaOBSO99pynAJEjKpJ28VT/7YgsVTfAbezIj2GwQjEF.gAD3m."  # lab only: "vlab123"
      mgmt_ip: 172.255.1.1/24
      loopback: 10.0.0.1/32
      interfaces:
        ge-0/0/0:
          description: "-> R3 : ge-0/0/0"
          ip: 10.0.13.1/24
        ge-0/0/1:
          description: "-> R4 : ge-0/0/1"
          ip: 10.0.14.1/24
        ge-0/0/2:
          description: "-> R5 : ge-0/0/0"
          ip: 10.0.15.1/24
        ge-0/0/3:
          description: "-> R6 : ge-0/0/1"
          ip: 10.0.16.1/24
        ge-0/0/4:
