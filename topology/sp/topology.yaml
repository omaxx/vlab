# SP lab from topology/topology.drawio (diagram "sp"): 10 Juniper vMX
# P: R1-R4, PE: R5-R8, CE: R10, R20; id = router number, link ip .<id> (R10/R20: .9), loopbacks from the drawing
# links are p2p: networks R<a>_R<b>, subnet 10.0.<a><b>.0/24 (R10/R20 count as 9)
# all devices also on mgmt-1 (networks/mgmt.yaml); fxp0 static ip 172.255.1.<id> (vars interfaces.fxp0), no dhcp
# config template configs/vmx.conf.j2, its vars in vars/<device>.jsonnet (common part: vars/common.libsonnet)

x-vmx: &vmx               # common part of all routers (x-* keys are ignored by vlab)
  type: jnpr/vmx
  version: 24.4R1-S2.9
  re_image: junos-vmx-x86-64-24.4R1-S2.9.qcow2
  fpc_image: vFPC-20241118.img
  mgmt:
    network: mgmt-1

devices:
  R1:
    <<: *vmx
    id: 1
    ports:
      - p2p: R1_R3
      - p2p: R1_R4
      - p2p: R1_R5
      - p2p: R1_R6
      - p2p: R1_R2
    config: vmx.conf.j2
    vars: vars/R1.jsonnet

  R2:
    <<: *vmx
    id: 2
    ports:
      - p2p: R2_R4
      - p2p: R2_R3
      - p2p: R2_R6
      - p2p: R2_R5
      - p2p: R1_R2
    config: vmx.conf.j2
    vars: vars/R2.jsonnet

  R3:
    <<: *vmx
    id: 3
    ports:
      - p2p: R1_R3
      - p2p: R2_R3
      - p2p: R3_R7
      - p2p: R3_R8
      - p2p: R3_R4
    config: vmx.conf.j2
    vars: vars/R3.jsonnet

  R4:
    <<: *vmx
    id: 4
    ports:
      - p2p: R2_R4
      - p2p: R1_R4
      - p2p: R4_R8
      - p2p: R4_R7
      - p2p: R3_R4
    config: vmx.conf.j2
    vars: vars/R4.jsonnet

  R5:
    <<: *vmx
    id: 5
    ports:
      - p2p: R1_R5
      - p2p: R2_R5
      - p2p: R5_R6
      - p2p: R5_R10
      - p2p: R5_R7
    config: vmx.conf.j2
    vars: vars/R5.jsonnet

  R6:
    <<: *vmx
    id: 6
    ports:
      - p2p: R2_R6
      - p2p: R1_R6
      - p2p: R5_R6
      - p2p: R6_R10
      - p2p: R6_R8
    config: vmx.conf.j2
    vars: vars/R6.jsonnet

  R7:
    <<: *vmx
    id: 7
    ports:
      - p2p: R3_R7
      - p2p: R4_R7
      - p2p: R7_R8
      - p2p: R7_R20
      - p2p: R5_R7
    config: vmx.conf.j2
    vars: vars/R7.jsonnet

  R8:
    <<: *vmx
    id: 8
    ports:
      - p2p: R4_R8
      - p2p: R3_R8
      - p2p: R7_R8
      - p2p: R8_R20
      - p2p: R6_R8
    config: vmx.conf.j2
    vars: vars/R8.jsonnet

  R10:
    <<: *vmx
    id: 10
    ports:
      - p2p: R5_R10
      - p2p: R6_R10
    config: vmx.conf.j2
    vars: vars/R10.jsonnet

  R20:
    <<: *vmx
    id: 20
    ports:
      - p2p: R7_R20
      - p2p: R8_R20
    config: vmx.conf.j2
    vars: vars/R20.jsonnet

networks: {}  # mgmt-1 is in networks/mgmt.yaml; links come from p2p ports
