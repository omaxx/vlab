# SP lab from topology/topology.drawio (diagram "sp"): 10 Juniper vMX + 6 Debian CE hosts
# P: R1-R4, PE: R5-R8, R10, R20; id = router number, link ip .<id> (R10/R20: .9), loopbacks 10.0.0.<id>
# router links are p2p: networks R<a>_R<b>, subnet 10.0.<a><b>.0/24 (R10/R20 count as 9)
# CE-<n>: Debian host behind R5-R8/R10/R20, link CE-<n>_R<x> 192.168.<n>.0/24 (CE .1, router .254);
#   port 1 mgmt-1 172.255.1.1<n> with default via mgmt-1 NAT (internet), port 2 to the router with
#   routes 10.0.0.0/8 and 192.168.0.0/16; id 20+<n> (MACs, consoles 6000+id*10)
# all devices also on mgmt-1 (networks/mgmt.yaml); fxp0 static ip 172.255.1.<id> (vars interfaces.fxp0), no dhcp
# config template configs/vmx.conf.j2, its vars in vars/<device>.jsonnet (common part: vars/common.libsonnet)

x-vmx: &vmx               # common part of all routers (x-* keys are ignored by vlab)
  type: jnpr/vmx
  version: 24.4R1-S2.9
  re_image: junos-vmx-x86-64-24.4R1-S2.9.qcow2
  fpc_image: vFPC-20241118.img
  mgmt:
    network: mgmt-1

x-ce: &ce                 # CE hosts: Debian cloud image
  type: linux
  user: maxim
  ssh_keys:
    - ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBM9Rs513ppdGvZsALPGJfkz2avWyuhr3DcOl4vGD5mgZVNO1eiKINqom9KrITTAZfU9oWiNvF9JbJ0k0CZq6qBk= omaxx@80a9971740eb
    - ssh-rsa  maxx.orlov@gmail.com

devices:
  R1:
    <<: *vmx
    id: 1
    ports:
      - p2p: R1_R3
      - p2p: R1_R4
      - p2p: R1_R2
      - p2p: R1_R5
      - p2p: R1_R6
    config: vmx.conf.j2
    vars: vars/R1.jsonnet

  R2:
    <<: *vmx
    id: 2
    ports:
      - p2p: R2_R4
      - p2p: R2_R3
      - p2p: R1_R2
      - p2p: R2_R6
      - p2p: R2_R5
    config: vmx.conf.j2
    vars: vars/R2.jsonnet

  R3:
    <<: *vmx
    id: 3
    ports:
      - p2p: R1_R3
      - p2p: R2_R3
      - p2p: R3_R4
      - p2p: R3_R7
      - p2p: R3_R8
    config: vmx.conf.j2
    vars: vars/R3.jsonnet

  R4:
    <<: *vmx
    id: 4
    ports:
      - p2p: R2_R4
      - p2p: R1_R4
      - p2p: R3_R4
      - p2p: R4_R8
      - p2p: R4_R7
    config: vmx.conf.j2
    vars: vars/R4.jsonnet

  R5:
    <<: *vmx
    id: 5
    ports:
      - p2p: R1_R5
      - p2p: R2_R5
      - p2p: R5_R6
      - p2p: R5_R10
      - p2p: CE-11_R5
    config: vmx.conf.j2
    vars: vars/R5.jsonnet

  R6:
    <<: *vmx
    id: 6
    ports:
      - p2p: R2_R6
      - p2p: R1_R6
      - p2p: R5_R6
      - p2p: R6_R10
      - p2p: CE-12_R6
    config: vmx.conf.j2
    vars: vars/R6.jsonnet

  R7:
    <<: *vmx
    id: 7
    ports:
      - p2p: R3_R7
      - p2p: R4_R7
      - p2p: R7_R8
      - p2p: R7_R20
      - p2p: CE-21_R7
    config: vmx.conf.j2
    vars: vars/R7.jsonnet

  R8:
    <<: *vmx
    id: 8
    ports:
      - p2p: R4_R8
      - p2p: R3_R8
      - p2p: R7_R8
      - p2p: R8_R20
      - p2p: CE-22_R8
    config: vmx.conf.j2
    vars: vars/R8.jsonnet

  R10:
    <<: *vmx
    id: 10
    ports:
      - p2p: R5_R10
      - p2p: R6_R10
      - p2p: CE-10_R10
    config: vmx.conf.j2
    vars: vars/R10.jsonnet

  R20:
    <<: *vmx
    id: 20
    ports:
      - p2p: R7_R20
      - p2p: R8_R20
      - p2p: CE-20_R20
    config: vmx.conf.j2
    vars: vars/R20.jsonnet

  CE-10:
    <<: *ce
    id: 30
    ports:
      - network: mgmt-1
        ip: 172.255.1.110/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-10_R10       # to R10 ge-0/0/2
        ip: 192.168.10.1/24
        routes:
          10.0.0.0/8: 192.168.10.254
          192.168.0.0/16: 192.168.10.254

  CE-11:
    <<: *ce
    id: 31
    ports:
      - network: mgmt-1
        ip: 172.255.1.111/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-11_R5       # to R5 ge-0/0/4
        ip: 192.168.11.1/24
        routes:
          10.0.0.0/8: 192.168.11.254
          192.168.0.0/16: 192.168.11.254

  CE-12:
    <<: *ce
    id: 32
    ports:
      - network: mgmt-1
        ip: 172.255.1.112/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-12_R6       # to R6 ge-0/0/4
        ip: 192.168.12.1/24
        routes:
          10.0.0.0/8: 192.168.12.254
          192.168.0.0/16: 192.168.12.254

  CE-20:
    <<: *ce
    id: 40
    ports:
      - network: mgmt-1
        ip: 172.255.1.120/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-20_R20       # to R20 ge-0/0/2
        ip: 192.168.20.1/24
        routes:
          10.0.0.0/8: 192.168.20.254
          192.168.0.0/16: 192.168.20.254

  CE-21:
    <<: *ce
    id: 41
    ports:
      - network: mgmt-1
        ip: 172.255.1.121/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-21_R7       # to R7 ge-0/0/4
        ip: 192.168.21.1/24
        routes:
          10.0.0.0/8: 192.168.21.254
          192.168.0.0/16: 192.168.21.254

  CE-22:
    <<: *ce
    id: 42
    ports:
      - network: mgmt-1
        ip: 172.255.1.122/24
        gateway: 172.255.1.254   # default: internet via mgmt-1 NAT
        dns: [172.255.1.254]
      - p2p: CE-22_R8       # to R8 ge-0/0/4
        ip: 192.168.22.1/24
        routes:
          10.0.0.0/8: 192.168.22.254
          192.168.0.0/16: 192.168.22.254

networks: {}  # mgmt-1 is in networks/mgmt.yaml; links come from p2p ports
