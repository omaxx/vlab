# SP lab from topology/topology.drawio (diagram "sp"): 10 Juniper vMX
# P: R1-R4, PE: R5-R8, CE: R10, R20; id = router number, link ip .<id>, loopbacks from the drawing
# links are p2p: networks R<a>_R<b>, subnet 10.0.<a><b>.0/24 (R10/R20 count as 9)
# all devices also on mgmt-1 (networks/mgmt.yaml); fxp0 static ip vars.mgmt_ip 172.255.1.<id>, no dhcp
# config template configs/vmx.conf.j2

x-vmx: &vmx               # common part of all routers (x-* keys are ignored by vlab)
  type: jnpr/vmx
  version: 24.4R1-S2.9
  re_image: junos-vmx-x86-64-24.4R1-S2.9.qcow2
  fpc_image: vFPC-20241118.img
  mgmt:
    network: mgmt-1

x-vars: &vars            # vars common to all routers
  root_pass: "$6$JhkcroEHcPSaKy69$4a1Yh9qDiogdCpHhTUr4onYbXWaEFBVco09XQwnqyhldN0HEEVv3tArAdMaETiidyS5aS1Ud.Yv2I7akBRNZK1"  # lab only: "Juniper#123"
  user_name: jnpr
  user_pass: "$6$FJxmFnSBuGoQmmD1$FtEb83qJ8ykiLYt4Lm0NFGQI806taetWYJLS.wtp/rz4quO221hzMZJOl8pFix0JStXa4FE8auqqZIoUAmL2i0"  # lab only: "Juniper#123"
  user_key: |             # ~/.ssh/authorized_keys
    ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBM9Rs513ppdGvZsALPGJfkz2avWyuhr3DcOl4vGD5mgZVNO1eiKINqom9KrITTAZfU9oWiNvF9JbJ0k0CZq6qBk= omaxx@80a9971740eb
    ssh-rsa  maxx.orlov@gmail.com

