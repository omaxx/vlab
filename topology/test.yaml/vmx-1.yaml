type: jnpr/vmx
name: vmx-1
id: 3                     # MACs ca:ff:ee:03:...
version: 24.4R1-S2.9      # images in /var/lib/vlab/images/junos/vmx/24.4R1-S2.9
re_image: junos-vmx-x86-64-24.4R1-S2.9.qcow2
fpc_image: vFPC-20241118.img
mgmt:                     # RE fxp0
  network: mgmt-1
  ip: 172.255.1.3/24
  dhcp: true              # fixed lease + DNS name "vmx-1" in mgmt-1
ports:                    # ge-0/0/0, ge-0/0/1
  - network: p2p-1
  - network: p2p-2
# lab only: root password "vlab123"
config: |
  system {
      host-name vmx-1;
      root-authentication {
          encrypted-password "$6$vlabvlab$5dQUFdNoOCf9So8AVoZ6h0YNmeTTcxbnITrhfaOBSO99pynAJEjKpJ28VT/7YgsVTfAbezIj2GwQjEF.gAD3m.";
      }
      services {
          ssh {
              root-login allow;
          }
      }
  }
  chassis {
      fpc 0 {
          lite-mode;
      }
  }
  interfaces {
      fxp0 {
          unit 0 {
              family inet {
                  address 172.255.1.3/24;
              }
          }
      }
      ge-0/0/0 {
          unit 0 {
              family inet {
                  address 192.168.1.3/24;
              }
          }
      }
      ge-0/0/1 {
          unit 0 {
              family inet {
                  address 192.168.2.3/24;
              }
          }
      }
  }
