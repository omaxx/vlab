[project]
name = "vlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "jsonnet>=0.22.0",
    "libvirt-python>=12.8.0",
    "mashumaro>=3.23",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
vlab = "vlab.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
