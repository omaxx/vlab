[project]
name = "vlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "jsonnet>=0.22.0",
    "libvirt-python>=12.8.0",
    "mashumaro>=3.23",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
vlab = "vlab.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-jsonnet>=0.22.0.20260408",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# libvirt-python has inline annotations but no py.typed marker
module = ["libvirt"]
follow_untyped_imports = true
